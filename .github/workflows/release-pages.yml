name: Release And Pages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.9
  WEB_DIST: target/dx/rton-editor/release/web/public

jobs:
  build_native:
    name: Build Native (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: rton-editor-linux-x86_64
            binary: rton-editor
          - os: ubuntu-24.04-arm
            artifact: rton-editor-linux-aarch64
            binary: rton-editor
          - os: macos-15
            artifact: rton-editor-macos-aarch64
            binary: rton-editor
          - os: windows-2025-vs2026
            artifact: rton-editor-windows-x86_64
            binary: rton-editor.exe
          - os: windows-11-arm
            artifact: rton-editor-windows-aarch64
            binary: rton-editor.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --package rton-editor-app --bin rton-editor

      - name: Package native artifact
        if: runner.os != 'Windows'
        run: |
          PACKAGE_DIR="${{ matrix.artifact }}-${{ github.ref_name }}"
          mkdir -p "$PACKAGE_DIR"
          cp "target/release/${{ matrix.binary }}" "$PACKAGE_DIR/"
          cp -R app/assets "$PACKAGE_DIR/assets"
          zip -r "${PACKAGE_DIR}.zip" "$PACKAGE_DIR"

      - name: Package native artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "${{ matrix.artifact }}-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" $packageDir
          Copy-Item "app/assets" "$packageDir/assets" -Recurse
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir.zip"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

  build_wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Dioxus CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Build WASM site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          dx build \
            --platform web \
            --package rton-editor-app \
            --release \
            --debug-symbols=false \
            --base-path "/${REPO_NAME}/"
          touch "${WEB_DIST}/.nojekyll"

      - name: Package web artifact
        run: |
          PACKAGE_NAME="rton-editor-web-${{ github.ref_name }}.zip"
          cd "${WEB_DIST}"
          zip -r "${GITHUB_WORKSPACE}/${PACKAGE_NAME}" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rton-editor-web
          path: rton-editor-web-${{ github.ref_name }}.zip

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_DIST }}

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_native, build_wasm]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  deploy_pages:
    name: Deploy To GitHub Pages
    runs-on: ubuntu-latest
    needs: build_wasm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
